# API Gateway (strangler facade): новые функции идут в микросервисы,
# остальное — в монолит. По мере переноса маршруты переключаются на сервисы.
server {
    listen 80;

    # DNS Docker: адреса сервисов резолвятся на каждый запрос (с кэшем 10 с),
    # поэтому пересборка одного сервиса не требует перезапуска gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $device_service http://device-service:8082;
    set $telemetry_service http://telemetry-service:8083;
    set $monolith http://app:8080;

    location /api/v1/devices {
        proxy_pass $device_service;
    }

    location /api/v1/telemetry {
        proxy_pass $telemetry_service;
    }

    location / {
        proxy_pass $monolith;
    }
}
